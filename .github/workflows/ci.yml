name: ci

on: [push, pull_request]

env:
  NODE_VERSION: 22

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      # Re-downloads the vendored Safenet sources at the commit each file records and diffs them,
      # so a local edit or a stale pin fails the build rather than going unnoticed.
      - run: npm run vendor:check

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm run build
      # Runs after the build, which generates the TypeChain types it needs.
      - run: npm run build:ts:typecheck
      - run: npm run test
      # The benchmarks assert nothing, but running them keeps the suite from rotting unnoticed.
      - run: npm run test:bench

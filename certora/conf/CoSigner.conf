{
    // CoSigner.spec, every rule; rows R-COS-1, R-COS-3, R-COS-4, R-COS-5, W-COS-1, and the verdict-binding rules.
    // Non-default flags and modelling decisions: D-007, L-COS-1, L-COS-7, L-COS-12, L-SAFE-1, L-W0-HASH.
    // Safe in scene: Safe v1.5.0 itself, inherited unchanged by RealSafeHarness (L-SAFE-1), rather than the
    //     mock because the rows bind the verdict to Safe's own nonce and transaction hash. The three maps
    //     below compile that file for `paris` with the optimizer off, the settings it ships under; the
    //     verified contract keeps the suite's four flags.
    //     The compiler version is the one setting not reproduced: RealSafeHarness compiles with solc-0.8.30
    //     while hardhat.config.ts builds Safe.sol with 0.8.28. Accepted, because the EVM version, optimizer
    //     setting and legacy pipeline are the ones that file ships under and the rules read the Safe only
    //     through source-level behaviour (nonce, getTransactionHash, getOwners, getThreshold), not bytecode.
    "msg": "CoSigner: CoSignerPolicy in isolation",
    "verify": "CoSignerPolicy:certora/specs/CoSigner.spec",
    "files": [
        "contracts/policies/CoSignerPolicy.sol",
        "certora/harnesses/RealSafeHarness.sol",
        "certora/harnesses/LibHarness.sol"
    ],
    "packages": [
        "@openzeppelin/contracts=node_modules/@openzeppelin/contracts",
        "@safe-global/safe-smart-account=node_modules/@safe-global/safe-smart-account"
    ],
    "solc": "solc-0.8.30",
    "solc_via_ir_map": {
        "CoSignerPolicy": true,
        "LibHarness": true,
        "RealSafeHarness": false
    },
    "solc_evm_version_map": {
        "CoSignerPolicy": "cancun",
        "LibHarness": "cancun",
        "RealSafeHarness": "paris"
    },
    "solc_optimize_map": {
        "CoSignerPolicy": "10000000",
        "LibHarness": "10000000",
        "RealSafeHarness": "0"
    },
    "loop_iter": "3",
    "optimistic_loop": false,
    "optimistic_hashing": true,
    "hashing_length_bound": "3200",
    "rule_sanity": "basic",
    "parametric_contracts": ["CoSignerPolicy"],
}

{
    // IncreasedThresholdOpenSafe.spec, every rule; rows R-IT-1, R-IT-2, R-IT-3, R-IT-6.
    // Non-default flags: L-IT-4, L-IT-11, L-SAFE-1, L-W0-HASH.
    // Safe in scene: Safe v1.5.0 itself, inherited unchanged by RealSafeHarness (L-SAFE-1), rather than the
    //     mock because the rows walk Safe's own owner list and threshold. The three maps below compile
    //     that file for `paris` with the optimizer off, the settings it ships under; the verified contract
    //     keeps the suite's four flags.
    //     The compiler version is the one setting not reproduced: RealSafeHarness compiles with solc-0.8.30
    //     while hardhat.config.ts builds Safe.sol with 0.8.28. Accepted, because the EVM version, optimizer
    //     setting and legacy pipeline are the ones that file ships under and the rules read the Safe only
    //     through source-level behaviour (nonce, getTransactionHash, getOwners, getThreshold), not bytecode.
    "msg": "IncreasedThresholdOpenSafe: the IncreasedThreshold rows over an arbitrary Safe (R-IT-1/2/3/6)",
    "verify": "IncreasedThresholdPolicy:certora/specs/IncreasedThresholdOpenSafe.spec",
    "files": [
        "contracts/policies/IncreasedThresholdPolicy.sol",
        "certora/harnesses/RealSafeHarness.sol"
    ],
    "packages": ["@safe-global/safe-smart-account=node_modules/@safe-global/safe-smart-account"],
    "solc": "solc-0.8.30",
    "solc_via_ir_map": {
        "IncreasedThresholdPolicy": true,
        "RealSafeHarness": false
    },
    "solc_evm_version_map": {
        "IncreasedThresholdPolicy": "cancun",
        "RealSafeHarness": "paris"
    },
    "solc_optimize_map": {
        "IncreasedThresholdPolicy": "10000000",
        "RealSafeHarness": "0"
    },
    "loop_iter": "5",
    "optimistic_loop": false,
    "optimistic_hashing": true,
    "hashing_length_bound": "3200",
    "rule_sanity": "basic",
    "parametric_contracts": ["IncreasedThresholdPolicy"],
}

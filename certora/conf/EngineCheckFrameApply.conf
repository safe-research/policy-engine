{
    // EngineCheckFrame.spec, 2 rules; row R-EC-1 at n <= 1. The second rule, EC_ConfigFrame_apply1,
    //     re-instantiates R-CFG-2 in this scene, a second leaf of that row beside the
    //     EngineConfigFrame* confs.
    // Non-default flags: L-EC-4, L-EC-6, L-EC-LOOP, L-EC-LOOP-N1, L-W0-1, L-W0-2, L-W0-HASH, L-W0-RECUR.
    //     `hashing_length_bound` is 448 here, not the suite's 3200: at n <= 1 the hashed terms are one
    //     Configuration entry and the root over it, which fit under 448 bytes.
    // Safe in scene: SafeMockHarness (L-W0-1); the guard-slot probe keeps the STATICCALL NONDET default.
    "msg": "EngineCheck: the applyConfiguration nodes of R-EC-1 and ConfigFrame, n=1",
    "verify": "SafePolicyGuardHarness:certora/specs/EngineCheckFrame.spec",
    "files": [
        "certora/harnesses/SafePolicyGuardHarness.sol",
        "certora/harnesses/SafeMockHarness.sol",
        "certora/harnesses/MockPolicyHarness.sol",
        "certora/harnesses/LibHarness.sol",
        "contracts/policies/AllowPolicy.sol",
        "contracts/policies/DenyPolicy.sol",
        "contracts/policies/OneTimeAllowPolicy.sol"
    ],
    "packages": [
        "@openzeppelin/contracts=node_modules/@openzeppelin/contracts"
    ],
    "solc": "solc-0.8.30",
    "solc_via_ir": true,
    "solc_evm_version": "cancun",
    "solc_optimize": "10000000",
    "loop_iter": "3",
    "optimistic_loop": false,
    "optimistic_hashing": true,
    "hashing_length_bound": "448",
    "rule_sanity": "basic",
    "parametric_contracts": ["SafePolicyGuardHarness"],
    "contract_recursion_limit": "1",
    "optimistic_contract_recursion": false,
    "summary_recursion_limit": "1",
    "optimistic_summary_recursion": false,
    "rule": ["R_EC_1_apply1", "EC_ConfigFrame_apply1"],

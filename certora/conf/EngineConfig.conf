{
    // EngineConfig.spec, 9 rules; rows R-CFG-4, R-CFG-5. W_CFG_1_W2 and W_CFG_1_W6 are the re-request and
    //     empty-array witnesses, and R_CFG_12_reRequest states that an expired root is spent and requestable
    //     again with no invalidateRoot. R_CFG_6a and R_CFG_11 run here unrestricted, and their rows are carried
    //     by the n <= 1 twins in EngineConfigRootPin.conf and EngineConfigApply.conf.
    // Non-default flags: L-CFG-HASH, L-CFG-LOOP, L-CFG-LOOP-N1, L-CFG-RECUR, L-W0-1, L-W0-2, L-W0-3,
    //     L-W0-RECUR.
    // Safe in scene: SafeMockHarness (L-W0-1); the guard-slot probe is answered by SafeSlotMock and
    //     GuardProbeResponderMock (L-CFG-SLOTMOCK, L-W0-3).
    "msg": "EngineConfig: request, invalidate and apply characterizations, and delay soundness (default encoding)",
    "verify": "SafePolicyGuardHarness:certora/specs/EngineConfig.spec",
    "files": [
        "certora/harnesses/SafePolicyGuardHarness.sol",
        "certora/harnesses/SafeMockHarness.sol",
        "certora/harnesses/Mocks.sol:GuardProbeResponderMock",
        "certora/harnesses/Mocks.sol:SafeSlotMock",
        "certora/harnesses/MockPolicyHarness.sol",
        "certora/harnesses/LibHarness.sol",
        "contracts/policies/AllowPolicy.sol",
        "contracts/policies/DenyPolicy.sol",
        "contracts/policies/OneTimeAllowPolicy.sol"
    ],
    "packages": [
        "@openzeppelin/contracts=node_modules/@openzeppelin/contracts"
    ],
    "solc": "solc-0.8.30",
    "solc_via_ir": true,
    "solc_evm_version": "cancun",
    "solc_optimize": "10000000",
    "loop_iter": "3",
    "optimistic_loop": false,
    "optimistic_hashing": true,
    "hashing_length_bound": "3200",
    "rule_sanity": "basic",
    "parametric_contracts": ["SafePolicyGuardHarness"],
    "contract_recursion_limit": "1",
    "optimistic_contract_recursion": false,
    "rule": [
        "R_CFG_4",
        "R_CFG_5",
        "R_CFG_6a",
        "R_CFG_11",
        "R_CFG_12_reRequest",
        "W_CFG_1_W1",
        "W_CFG_1_W2",
        "W_CFG_1_W3",
        "W_CFG_1_W6"
    ],
    "smt_timeout": "1800",
}

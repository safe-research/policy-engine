{
    // EngineCheck.spec, 6 rules; rows R-EC-5, R-EC-6, R-EC-7, R-EC-8, and a nested tail-data witness. Split from
    //     EngineCheckNested.conf for contract_recursion_limit 1 with an asserted summary bound: the limit-2
    //     confs do not converge on these rules.
    // Non-default flags: L-EC-4, L-EC-6, L-EC-LOOP, L-W0-1, L-W0-2, L-W0-HASH, L-W0-RECUR.
    // Safe in scene: SafeMockHarness (L-W0-1); the guard-slot probe keeps the STATICCALL NONDET default.
    "msg": "EngineCheck: the rows that leave the mock re-entrant, R-EC-7/8 nested and the no-policy-on-revert clauses",
    "verify": "SafePolicyGuardHarness:certora/specs/EngineCheck.spec",
    "files": [
        "certora/harnesses/SafePolicyGuardHarness.sol",
        "certora/harnesses/SafeMockHarness.sol",
        "certora/harnesses/MockPolicyHarness.sol",
        "certora/harnesses/LibHarness.sol",
        "contracts/policies/AllowPolicy.sol",
        "contracts/policies/DenyPolicy.sol",
        "contracts/policies/OneTimeAllowPolicy.sol"
    ],
    "packages": [
        "@openzeppelin/contracts=node_modules/@openzeppelin/contracts"
    ],
    "solc": "solc-0.8.30",
    "solc_via_ir": true,
    "solc_evm_version": "cancun",
    "solc_optimize": "10000000",
    "loop_iter": "3",
    "optimistic_loop": false,
    "optimistic_hashing": true,
    "hashing_length_bound": "3200",
    "rule_sanity": "basic",
    "parametric_contracts": ["SafePolicyGuardHarness"],
    "contract_recursion_limit": "1",
    "optimistic_contract_recursion": false,
    "summary_recursion_limit": "1",
    "optimistic_summary_recursion": false,
    "rule": [
        "R_EC_7_nested",
        "R_EC_7_nested_data",
        "W_EC_1_k_nestedTailData",
        "R_EC_8_nested",
        "R_EC_5_noPolicyOnRevert",
        "R_EC_6_noPolicyOnRevert"
    ],
    "prover_args": ["-maxCommandCount 4000000 -maxBlockCount 500000"],
    "smt_timeout": "1800",
}

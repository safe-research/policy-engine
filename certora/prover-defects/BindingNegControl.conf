{
    // Defect A negative control for conf/Binding.conf (report 6.2): the verify target drops nonce from the
    //     SafeTx pre-image, so R_BIND_1 fails while R_BIND_1_mirrorPin wrongly succeeds (L-BIND-9). This
    //     conf filters R_BIND_1 alone; widen it with
    //     --rule R_BIND_1 R_BIND_1_mirrorPin R_BIND_1_structPin to see both verdicts in one job.
    // Non-default flags: L-BIND-5, L-BIND-7, L-W0-HASH.
    // Safe in scene: SafeMockHarness through the mutated BindingHarness of BindingNegControl.sol, which
    //     subclasses it and overrides nothing (L-W0-1, L-BIND-4); only the SafeTx pre-image is mutated,
    //     the Safe body around it staying verbatim (L-BIND-8).
    "msg": "BindingNegControl: negative control, nonce dropped from the SafeTx pre-image, R_BIND_1 must fail",
    "verify": "BindingHarness:certora/specs/Binding.spec",
    "rule": ["R_BIND_1"],
    "files": [
        "certora/prover-defects/BindingNegControl.sol:BindingHarness",
        "contracts/policies/CoSignerPolicy.sol",
        "contracts/policies/IncreasedThresholdPolicy.sol",
        "contracts/policies/SafenetPolicy.sol"
    ],
    "packages": ["@openzeppelin/contracts=node_modules/@openzeppelin/contracts"],
    "solc": "solc-0.8.30",
    "solc_via_ir": true,
    "solc_evm_version": "cancun",
    "solc_optimize": "10000000",
    "loop_iter": "5",
    "optimistic_loop": false,
    "optimistic_hashing": true,
    "hashing_length_bound": "3200",
    "rule_sanity": "basic"
}
